<article class="doc all-doc">
  <header class="doc-head">
    <h1>Всё одной страницей</h1>
    <p class="doc-summary">{{pages_count}} разделов подряд — удобно для поиска по <kbd>Ctrl</kbd>+<kbd>F</kbd> и для печати в PDF.</p>
    <div class="doc-meta"><button type="button" class="btn" onclick="window.print()">🖨 Распечатать / сохранить в PDF</button></div>
  </header>
  <div class="doc-body">
{{body}}
  </div>
</article>
