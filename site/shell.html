<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Шпаргалка Yii2</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>/*{{STYLES}}*/</style>

<header class="topbar">
  <button type="button" id="menu-btn" class="icon-btn menu-btn" aria-label="Список разделов">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
  </button>
  <div class="brand"><b>Шпаргалка Yii2</b><span>выжимка руководства 2.0</span></div>
  <div class="search">
    <div class="search-field">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>
      <input id="q" type="search" placeholder="Поиск по разделам и коду…" autocomplete="off" spellcheck="false" aria-label="Поиск по шпаргалке">
      <kbd id="q-hint">/</kbd>
    </div>
    <div id="results" class="results" hidden></div>
  </div>
  <button type="button" id="all-btn" class="icon-btn" aria-pressed="false" aria-label="Показать все разделы одной страницей" title="Все разделы одной страницей">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3.5 21 8l-9 4.5L3 8z"/><path d="m4.5 12.5 7.5 3.8 7.5-3.8M4.5 16.8l7.5 3.7 7.5-3.7"/></svg>
  </button>
  <button type="button" id="theme-btn" class="icon-btn" aria-label="Тёмная тема"></button>
</header>

<div class="shell">
  <aside class="sidebar" id="sidebar">
    <div class="nav-label">Разделы</div>
    <nav class="nav">
<!--{{NAV}}-->
    </nav>
    <div class="nav-foot">
      <p>Выжимка официального руководства Yii&nbsp;2.0 — все 100 глав <span class="mono">guide-ru</span> в 17 разделах.</p>
      <p>
        <a href="https://www.yiiframework.com/doc/guide/2.0/ru" target="_blank" rel="noopener">Полное руководство ↗</a><br>
        <a href="https://www.yiiframework.com/doc/api/2.0" target="_blank" rel="noopener">Описание классов ↗</a>
      </p>
      <p><span class="mono">/</span> — поиск, <span class="mono">Esc</span> — закрыть</p>
    </div>
  </aside>

  <main class="main">
    <div class="wrap">
      <div class="doc">
<!--{{SECTIONS}}-->
      </div>
      <aside class="rail" id="rail" aria-label="Содержание раздела"></aside>
    </div>
  </main>
</div>

<div class="scrim" id="scrim"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script>/*{{DATA}}*/</script>
<script>/*{{APP}}*/</script>
